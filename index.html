<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <div id="followUpAlerts"></div>

    <div class="header">

    <h1>Case Tracker</h1>

    <button id="themeToggle" onclick="toggleTheme()">
        🌙 Dark Mode
    </button>
    

</div>

    <!-- FILTRO DE PERÍODO GLOBAL -->
    <div class="global-filter">
        <div class="filter-group">
            <label>Período do Dashboard:</label>
            <div class="period-controls">
                <input type="date" id="globalDateFrom" onchange="applyGlobalFilter()">
                <span class="separator">até</span>
                <input type="date" id="globalDateTo" onchange="applyGlobalFilter()">
                <button class="clear-period-btn" onclick="clearGlobalFilter()">Limpar</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <!-- DASHBOARD + GRÁFICO -->
<div class="dashboard-panel">

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="card total-card">
            <div class="card-title">📊 Total</div>
            <div class="card-value" id="totalCases">0</div>
            <div class="card-subtitle">Casos válidos</div>
        </div>

        <div class="card needinfo">
            <div class="card-title">🟠 Need Info</div>
            <div class="card-value" id="needInfoCount">0</div>
            <div class="card-subtitle">Casos ativos</div>
        </div>

        <div class="card implemented">
            <div class="card-title">🟢 Implemented</div>
            <div class="card-value" id="implementedCount">0</div>
            <div class="card-subtitle">Resolvidos</div>
        </div>

        <div class="card inactive">
            <div class="card-title">🔴 Inactive</div>
            <div class="card-value" id="inactiveCount">0</div>
            <div class="card-subtitle">Sem ação</div>
        </div>

        <div class="card discarded">
            <div class="card-title">⚪ Discarded</div>
            <div class="card-value" id="discardedCount">0</div>
            <div class="card-subtitle">Descartados</div>
        </div>

    </div>

    <!-- GRÁFICO -->
    <div class="chart-container">
        <canvas id="statusChart"></canvas>
    </div>

</div>

    <!-- FORMULÁRIO -->
    <div class="form">

        <h2>Novo Caso</h2>

        <input type="text" id="caseNumber" placeholder="Número do Caso">

        <select id="status">
            <option value="">Selecione Status</option>
            <option>Need Info</option>
            <option>Implemented</option>
            <option>Inactive</option>
            <option>Discarded</option>
        </select>

        <select id="subStatus">
            <option value="">Selecione Substatus</option>
        </select>

        <textarea id="notes" placeholder="Observações"></textarea>

        <!-- FOLLOW UP - Visível apenas para Need Info, Inactive e Implemented -->
        <div id="followUpSection" class="follow-up-section" style="display: none;">
            <label>Follow Up</label>
            <div class="follow-up-controls">
                <input type="date" id="followUpDate">
                <label class="na-checkbox">
                    <input type="checkbox" id="followUpNA">
                    N/A (Não Aplicado)
                </label>
            </div>
        </div>

        <div class="checks">
            <label>
                <input type="checkbox" id="noteAdded">
                Nota Adicionada
            </label>

            <label>
                <input type="checkbox" id="emailSent">
                Email Enviado
            </label>

            <label>
                <input type="checkbox" id="qplusDone">
                QPlus Preenchido
            </label>
        </div>

        <button id="saveButton" onclick="saveCase()">
            Salvar Caso
        </button>

    </div>

    <!-- TABELA E FILTROS -->
    <div class="table-container">

        <!-- Filtros -->
        <div class="filters">

            <div class="filter-group">
                <label>Buscar caso:</label>
                <input
                    type="text"
                    id="search"
                    placeholder="Buscar por número..."
                    oninput="renderCases()">
            </div>

            <div class="filter-group">
                <label>Status:</label>
                <select id="filterStatus" onchange="renderCases()">
                    <option value="">All</option>
                    <option value="Implemented">Implemented</option>
                    <option value="Need Info">Need Info</option>
                    <option value="Inactive">Inactive</option>
                    <option value="Discarded">Discarded</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Data inicial:</label>
                <input type="date" id="filterDateFrom" onchange="renderCases()">
            </div>

            <div class="filter-group">
                <label>Data final:</label>
                <input type="date" id="filterDateTo" onchange="renderCases()">
            </div>

            <div class="filter-group filter-btn-group">
                <button class="clear-filters-btn" onclick="clearFilters()">Limpar Filtros</button>
            </div>

        </div>

        <table>

<thead>
   <tr>
      <th onclick="sortCases('caseNumber')">Caso ↕</th>
      <th onclick="sortCases('status')">Status ↕</th>
      <th>Substatus</th>
      <th onclick="sortCases('createdAt')">Criado ↕</th>
      <th onclick="sortCases('updatedAt')">Atualizado ↕</th>
      <th onclick="sortCases('followUpDate')">Follow Up ↕</th>
                <th>Nota</th>
                <th>Email</th>
                <th>QPlus</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="caseTable"></tbody>

        </table>

    </div>

</div>

<div id="viewModal" class="modal">
    <div class="modal-content">

        <span class="close-modal" onclick="closeViewModal()">
            &times;
        </span>

        <h2>Detalhes do Caso</h2>

        <div id="modalBody"></div>

    </div>
</div>


<script src="script.js"></script>

</body>
</html>
